version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: twstock_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-twstock_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-twstock_password}
      POSTGRES_DB: ${DB_NAME:-twstock_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-twstock_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - twstock_network

  redis:
    image: redis:7-alpine
    container_name: twstock_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - twstock_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twstock_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-twstock_user}
      DB_PASSWORD: ${DB_PASSWORD:-twstock_password}
      DB_NAME: ${DB_NAME:-twstock_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./backend/src:/app/backend/src
    networks:
      - twstock_network
    restart: unless-stopped

  frontend:
    image: node:18-alpine
    container_name: twstock_frontend
    working_dir: /app/frontend
    command: npm run dev
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "3001:3001"
    environment:
      VITE_API_URL: http://localhost:3000/api
    depends_on:
      - backend
    networks:
      - twstock_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  twstock_network:
    driver: bridge
